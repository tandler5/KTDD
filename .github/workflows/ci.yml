name: CI/CD

on:
  push:
    branches:
      - trunk
      - release/dev
      - release/prod
  pull_request:
    branches: ["trunk"]

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: ktdd_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, dom, curl, libxml, mysql, sqlite, bcmath, intl
          coverage: xdebug

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install PHP dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Install JS dependencies
        run: npm ci

      - name: Generate key
        run: php artisan key:generate

      - name: Directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Pint (static analysis)
        run: ./vendor/bin/pint --test

      - name: Run PHPUnit (unit + feature + coverage)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ktdd_test
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test --log-junit junit.xml --coverage-text --coverage-clover=coverage.xml --coverage-html=coverage-html

      - name: Run Vitest
        run: npx vitest run

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true

      - name: Archive test and coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            junit.xml
            coverage-html/index.html
            coverage-html/**

  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/trunk' || github.ref == 'refs/heads/release/dev' || github.ref == 'refs/heads/release/prod')
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/release/dev' }}
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/release/prod' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and (optionally) push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/dev'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Check staging deploy secrets
        id: guard
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}
          STAGING_DB_USERNAME: ${{ secrets.STAGING_DB_USERNAME }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_APP_KEY: ${{ secrets.STAGING_APP_KEY }}
        run: |
          if [ -z "$KUBE_CONFIG_STAGING" ] || [ -z "$STAGING_DB_USERNAME" ] || [ -z "$STAGING_DB_PASSWORD" ] || [ -z "$STAGING_APP_KEY" ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Missing staging secrets, skipping deploy."
          else
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure kubeconfig
        if: steps.guard.outputs.can_deploy == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 --decode > ~/.kube/config

      - name: Ensure namespace exists
        if: steps.guard.outputs.can_deploy == 'true'
        run: kubectl apply -f k8s/overlays/staging/namespace.yaml

      - name: Apply staging secrets
        if: steps.guard.outputs.can_deploy == 'true'
        run: |
          kubectl create secret generic ktdd-secrets \
            --namespace ktdd-staging \
            --from-literal=DB_USERNAME="${{ secrets.STAGING_DB_USERNAME }}" \
            --from-literal=DB_PASSWORD="${{ secrets.STAGING_DB_PASSWORD }}" \
            --from-literal=APP_KEY="${{ secrets.STAGING_APP_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy staging manifests
        if: steps.guard.outputs.can_deploy == 'true'
        run: |
          kubectl apply -k k8s/overlays/staging
          kubectl set image deployment/ktdd-app app=ghcr.io/${{ github.repository }}:staging -n ktdd-staging
          kubectl rollout status deployment/ktdd-app -n ktdd-staging --timeout=120s

      - name: Skip staging deploy
        if: steps.guard.outputs.can_deploy != 'true'
        run: echo "Staging deploy skipped because required secrets are missing."

  deploy-production:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/prod'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Check production deploy secrets
        id: guard
        env:
          KUBE_CONFIG_PRODUCTION: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
          PRODUCTION_DB_USERNAME: ${{ secrets.PRODUCTION_DB_USERNAME }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          PRODUCTION_APP_KEY: ${{ secrets.PRODUCTION_APP_KEY }}
        run: |
          if [ -z "$KUBE_CONFIG_PRODUCTION" ] || [ -z "$PRODUCTION_DB_USERNAME" ] || [ -z "$PRODUCTION_DB_PASSWORD" ] || [ -z "$PRODUCTION_APP_KEY" ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Missing production secrets, skipping deploy."
          else
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure kubeconfig
        if: steps.guard.outputs.can_deploy == 'true'
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 --decode > ~/.kube/config

      - name: Ensure namespace exists
        if: steps.guard.outputs.can_deploy == 'true'
        run: kubectl apply -f k8s/overlays/production/namespace.yaml

      - name: Apply production secrets
        if: steps.guard.outputs.can_deploy == 'true'
        run: |
          kubectl create secret generic ktdd-secrets \
            --namespace ktdd-production \
            --from-literal=DB_USERNAME="${{ secrets.PRODUCTION_DB_USERNAME }}" \
            --from-literal=DB_PASSWORD="${{ secrets.PRODUCTION_DB_PASSWORD }}" \
            --from-literal=APP_KEY="${{ secrets.PRODUCTION_APP_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy production manifests
        if: steps.guard.outputs.can_deploy == 'true'
        run: |
          kubectl apply -k k8s/overlays/production
          kubectl set image deployment/ktdd-app app=ghcr.io/${{ github.repository }}:production -n ktdd-production
          kubectl rollout status deployment/ktdd-app -n ktdd-production --timeout=120s

      - name: Skip production deploy
        if: steps.guard.outputs.can_deploy != 'true'
        run: echo "Production deploy skipped because required secrets are missing."
