services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ktdd-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - ktdd-network
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: ktdd-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - ktdd-network

  db:
    image: mysql:8.0
    container_name: ktdd-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ktdd}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME:-ktdd_user}
    ports:
      - "33060:3306"
    networks:
      - ktdd-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s

networks:
  ktdd-network:
    driver: bridge
