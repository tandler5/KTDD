apiVersion: apps/v1
kind: Deployment
metadata:
  name: ktdd-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ktdd-app
  template:
    metadata:
      labels:
        app: ktdd-app
    spec:
      containers:
        - name: app
          image: ghcr.io/example/ktdd:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: ktdd-config
            - secretRef:
                name: ktdd-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10

