apiVersion: apps/v1
kind: Deployment
metadata:
  name: ktdd-db
spec:
  selector:
    matchLabels:
      app: ktdd-db
  template:
    metadata:
      labels:
        app: ktdd-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: ktdd-config
              key: DB_DATABASE
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ktdd-secrets
              key: DB_PASSWORD
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: ktdd-db
spec:
  selector:
    app: ktdd-db
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
